name: Collect grid carbon data

on:
  schedule:
    # Every 30 minutes, a few minutes after each half-hour so the API has published.
    # GitHub can delay scheduled runs by several minutes at busy times.
    - cron: "5,35 * * * *"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs / backfills
    inputs:
      backfill_days:
        description: "Days of history to load (leave blank for a normal run)"
        required: false

permissions:
  contents: write      # lets the workflow commit the updated CSVs

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run collector
        run: |
          if [ -n "${{ github.event.inputs.backfill_days }}" ]; then
            python collect.py --backfill "${{ github.event.inputs.backfill_days }}"
          else
            python collect.py
          fi

      - name: Commit data if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
